[package]
name = "lazycomb_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "lazycomb_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "num-bigint"] }
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
